<!doctype html>
<html lang="id" xmlns:th="http://wwww.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>
    <h1>
        Create New Controller
    </h1>
    <form method="POST" th:action="@{/author/new}" th:object="${authorDTO}">

        <input type="submit" value="Submit">
    </form>

</body>
</html>
