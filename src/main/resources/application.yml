spring:
  application:
    name: book-catalog
  profiles:
    active: development
  datasource:
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000


server:
  port: 8081

logging:
  level:
    com:
      hamfizh:
        bookcatalog:
          web: TRACE

---
spring:
  config:
    activate:
      on-profile: development

app:
  welcome-text: custom property binding
  currency: IDR
  timezone: Asia/Jakarta



